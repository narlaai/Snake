<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <section class="workspace">
            <section class="board-panel card">
                <div class="board-top">
                    <div class="brand">
                        <p class="eyebrow">Snake</p>
                        <h1>贪吃蛇</h1>
                    </div>
                    <div class="topbar-actions">
                        <button id="start-button" class="button button-primary">开始游戏</button>
                        <button id="pause-button" class="button">暂停</button>
                        <button id="restart-button" class="button">重新开始</button>
                        <button id="continue-button" class="button">继续上次</button>
                    </div>
                </div>

                <div class="board-header">
                    <div>
                        <p class="eyebrow">游戏区</p>
                    </div>
                    <p id="mode-hint" class="mode-hint">经典模式，撞墙结束。</p>
                </div>

                <div id="board-stage" class="board-stage">
                    <canvas id="game-board" width="640" height="640" aria-label="贪吃蛇游戏画布"></canvas>
                    <div id="overlay" class="overlay">
                        <div class="overlay-card">
                            <p id="overlay-kicker" class="eyebrow">准备就绪</p>
                            <h3 id="overlay-title">按开始按钮或方向键进入游戏</h3>
                            <p id="overlay-text" class="overlay-text">游戏会自动保存当前对局，刷新页面后可以继续。</p>
                            <div class="overlay-actions">
                                <button id="overlay-primary" class="button button-primary">开始游戏</button>
                                <button id="overlay-secondary" class="button">重新开始</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mobile-pad" aria-label="方向控制">
                    <button class="pad-button" data-direction="up" aria-label="向上">↑</button>
                    <div class="pad-row">
                        <button class="pad-button" data-direction="left" aria-label="向左">←</button>
                        <button class="pad-button" data-direction="down" aria-label="向下">↓</button>
                        <button class="pad-button" data-direction="right" aria-label="向右">→</button>
                    </div>
                </div>
            </section>

            <aside class="side-panel">
                <section class="card stats-card">
                    <div class="stats-grid">
                        <article class="stat-item">
                            <span class="stat-label">分数</span>
                            <strong id="score-value" class="stat-value">0</strong>
                        </article>
                        <article class="stat-item">
                            <span class="stat-label">最高分</span>
                            <strong id="best-value" class="stat-value">0</strong>
                        </article>
                        <article class="stat-item">
                            <span class="stat-label">速度</span>
                            <strong id="speed-value" class="stat-value">1.0x</strong>
                        </article>
                        <article class="stat-item">
                            <span class="stat-label">状态</span>
                            <strong id="status-value" class="stat-value">待开始</strong>
                        </article>
                    </div>
                </section>

                <section class="card controls-card">
                    <div class="panel-title-row">
                        <div>
                            <p class="eyebrow">设置</p>
                            <h2>对局参数</h2>
                        </div>
                    </div>

                    <div class="control-grid">
                        <label class="field">
                            <span>棋盘尺寸</span>
                            <select id="size-select">
                                <option value="16">16 x 16</option>
                                <option value="20">20 x 20</option>
                                <option value="24" selected>24 x 24</option>
                                <option value="28">28 x 28</option>
                            </select>
                        </label>
                        <label class="field">
                            <span>边界规则</span>
                            <select id="boundary-select">
                                <option value="wall">撞墙结束</option>
                                <option value="wrap">穿墙循环</option>
                            </select>
                        </label>
                        <label class="field field-wide">
                            <span>游戏模式</span>
                            <select id="mode-select">
                                <option value="classic">经典</option>
                                <option value="sprint">60 秒冲刺</option>
                                <option value="zen">放松模式</option>
                            </select>
                        </label>
                        <label class="field field-wide">
                            <span>起始速度</span>
                            <select id="speed-select">
                                <option value="slow">慢</option>
                                <option value="normal" selected>标准</option>
                                <option value="fast">快</option>
                            </select>
                        </label>
                        <label class="field field-wide">
                            <span>随机障碍</span>
                            <select id="obstacle-select">
                                <option value="none">关闭</option>
                                <option value="spike">尖刺：碰到直接结束</option>
                                <option value="trim">毒果：碰到会缩短身体</option>
                            </select>
                        </label>
                    </div>

                    <div class="control-actions">
                        <button id="sound-button" class="button">音效：开</button>
                        <button id="clear-save-button" class="button">清除继续记录</button>
                    </div>

                    <div class="helper-lines">
                        <p id="timer-label">当前计时：不限时</p>
                        <p>切换尺寸、规则或模式时会自动重开。</p>
                    </div>
                </section>

                <section class="card records-card">
                    <div class="panel-title-row">
                        <div>
                            <p class="eyebrow">记录</p>
                            <h2>本地最高分</h2>
                        </div>
                    </div>
                    <ol id="records-list" class="records-list"></ol>
                </section>
            </aside>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
